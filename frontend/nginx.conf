server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime las respuestas de texto (JS/CSS/HTML) servidas al navegador.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # El cliente llama a rutas bajo /api/*; se reenvían al backend dentro de la
    # red de docker-compose (mismo prefijo que remueve el proxy de Vite en dev).
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre (los que genera Vite): cache largo.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta que no sea un archivo real cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
